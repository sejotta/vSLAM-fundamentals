[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vslam-fundamentals"
version = "0.1.0"
description = "A compact, readable monocular visual SLAM pipeline with a synthetic scene generator."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vSLAM Fundamentals contributors" }]
keywords = ["visual-slam", "computer-vision", "structure-from-motion", "opencv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
learned = ["torch>=2.0"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/sejotta/vSLAM-fundamentals"

[tool.setuptools.packages.find]
include = ["vslam*"]
